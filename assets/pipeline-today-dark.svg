<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" role="img" aria-label="How work moves today. An idea is talked through in a live agent conversation and gets route advice: core pipeline, bounded goal or direct task. Core pipeline work is planned, independently reviewed, redlined by me, wrapped and synced to issues; build-phase then runs each build-step in an isolated worktree with tests, independent reviewers and landing gates. Bounded goals run with a budget and stop rule; direct tasks run inline with a named check. All results come to my acceptance, then wrap-up and hygiene; a status dashboard is built from the plan files. I start each stage myself today.">
  <defs>
    <marker id="ar-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#384153"/></marker>
    <marker id="ar-s-dark" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6E9BFF"/></marker>
    <filter id="sh-dark" x="-20%" y="-45%" width="140%" height="190%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,.5)"/></filter>
  </defs>
  <style>
    .bg{fill:#161C26;stroke:#29313F;stroke-width:1.5}
    .lnk{fill:none;stroke:#384153;stroke-width:1.7}
    .spine{fill:none;stroke:#6E9BFF;stroke-width:2.4}
    .node rect{fill:#161C26;stroke:#384153;stroke-width:1.4;filter:url(#sh-dark)}
    .node.today rect{stroke:#6E9BFF;stroke-width:1.6}
    .node.now rect{stroke:#6E9BFF;stroke-width:1.8;stroke-dasharray:6 4}
    .node.planned rect{stroke:#384153;stroke-width:1.4;stroke-dasharray:3 4}
    .pn{fill:#6E9BFF;font-size:13px;font-weight:600}
    .planned .pn{fill:#9AA5B8}
    .ps{fill:#9AA5B8;font-size:10.5px}
    .lbl{fill:#9AA5B8;font-size:11px;letter-spacing:.12em;font-weight:600}
    .cap{fill:#9AA5B8;font-size:10.5px}
    .tag{fill:#6E9BFF;font-size:10px;font-weight:600;letter-spacing:.08em}
  </style>
<rect class="bg" x="6" y="6" width="988" height="388" rx="16"/>
<text class="lbl" x="24" y="32">START</text>
<text class="lbl" x="280" y="32">PLAN</text>
<text class="lbl" x="536" y="32">BUILD</text>
<text class="lbl" x="792" y="32">FINISH</text>
<g class="node"><rect x="24" y="46" width="200" height="48" rx="10"/><text class="pn" x="38" y="67">conversation</text><text class="ps" x="38" y="85">an idea, talked through</text></g>
<path class="lnk" marker-end="url(#ar-dark)" d="M124,94 V108"/>
<g class="node"><rect x="24" y="108" width="200" height="48" rx="10"/><text class="pn" x="38" y="129">route advice</text><text class="ps" x="38" y="147">pipeline / goal / direct</text></g>
<path class="spine" marker-end="url(#ar-s-dark)" d="M224,132 H252 V70 H280"/>
<g class="node"><rect x="280" y="46" width="200" height="48" rx="10"/><text class="pn" x="294" y="67">plan + review</text><text class="ps" x="294" y="85">draft, independent review</text></g>
<path class="lnk" marker-end="url(#ar-dark)" d="M380,94 V108"/>
<g class="node"><rect x="280" y="108" width="200" height="48" rx="10"/><text class="pn" x="294" y="129">plan-redline</text><text class="ps" x="294" y="147">I mark it up; agent folds</text></g>
<path class="lnk" marker-end="url(#ar-dark)" d="M380,156 V170"/>
<g class="node"><rect x="280" y="170" width="200" height="48" rx="10"/><text class="pn" x="294" y="191">wrap + repo-sync</text><text class="ps" x="294" y="209">issues + durable handoff</text></g>
<path class="spine" marker-end="url(#ar-s-dark)" d="M480,194 H508 V70 H536"/>
<g class="node"><rect x="536" y="46" width="200" height="140" rx="10"/><text class="pn" x="550" y="67">build-phase</text><text class="ps" x="550" y="85">build-step x N, each:</text><text class="ps" x="564" y="103">isolated git worktree</text><text class="ps" x="564" y="121">tests + checks</text><text class="ps" x="564" y="139">independent reviewers</text><text class="ps" x="564" y="157">lands only if gates pass</text></g>
<path class="lnk" marker-end="url(#ar-dark)" d="M124,156 V256 H536"/>
<path class="lnk" marker-end="url(#ar-dark)" d="M124,256 V318 H536"/>
<g class="node"><rect x="536" y="232" width="200" height="48" rx="10"/><text class="pn" x="550" y="253">bounded goal</text><text class="ps" x="550" y="271">budget, stop rule, evidence</text></g>
<g class="node"><rect x="536" y="294" width="200" height="48" rx="10"/><text class="pn" x="550" y="315">direct task</text><text class="ps" x="550" y="333">inline + named check</text></g>
<path class="spine" marker-end="url(#ar-s-dark)" d="M736,70 H792"/>
<path class="lnk" marker-end="url(#ar-dark)" d="M736,256 H764 V84 H792"/>
<path class="lnk" marker-end="url(#ar-dark)" d="M736,318 H764 V256"/>
<g class="node"><rect x="792" y="46" width="200" height="48" rx="10"/><text class="pn" x="806" y="67">my acceptance</text><text class="ps" x="806" y="85">UAT / walkthrough</text></g>
<path class="lnk" marker-end="url(#ar-dark)" d="M892,94 V108"/>
<g class="node"><rect x="792" y="108" width="200" height="48" rx="10"/><text class="pn" x="806" y="129">wrap + hygiene</text><text class="ps" x="806" y="147">lessons, memory, docs</text></g>
<g class="node"><rect x="792" y="232" width="200" height="48" rx="10"/><text class="pn" x="806" y="253">status dashboard</text><text class="ps" x="806" y="271">built from the plan files</text></g>
<text class="cap" x="24" y="364">Today I start each stage myself; agents do the work inside it, on this PC. Small size never skips a required check.</text>
<text class="cap" x="24" y="382">Goals report evidence, not a merge. Core-pipeline detail: the diagram below.</text>
</svg>
